<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dvorets Muz — Retro Player</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  :root {
    --ios-blue: #007aff;
    --ios-label: #000000;
    --ios-label-secondary: rgba(60, 60, 67, 0.6);
    --ios-label-tertiary: rgba(60, 60, 67, 0.3);
    --ios-separator: rgba(60, 60, 67, 0.29);
    --ease-ios: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    background: #000;
    color: #fff;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    transition: background 2s var(--ease-ios);
  }

  /* ================= AMBIENT LIGHT ================= */
  #room-light {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      circle at 50% 45%,
      rgba(122, 162, 255, 0.28) 0%,
      rgba(122, 162, 255, 0.08) 30%,
      rgba(0, 0, 0, 0) 65%
    );
    opacity: 0;
    transition: opacity 2s var(--ease-ios);
  }

  /* ================= STAGE ================= */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    pointer-events: none;
    perspective: 1400px;
  }

  /* ================= PLAYER ================= */
  .player {
    position: relative;
    z-index: 20; /* above the jack — tip slides BEHIND the body */
    width: 340px;
    height: 620px;
    border-radius: 44px;
    background: linear-gradient(160deg, #2b2b33 0%, #1a1a20 40%, #121218 100%);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.14),
      inset 0 -2px 4px rgba(0, 0, 0, 0.7),
      0 50px 100px rgba(0, 0, 0, 0.75),
      0 20px 40px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    transform: scale(0.85) rotateX(15deg) translateY(40px);
    transform-style: preserve-3d;
    transition: box-shadow 2s var(--ease-ios);
    pointer-events: auto;
    padding: 22px;
    will-change: transform;
  }

  .jack-port {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 8px;
    border-radius: 0 0 3px 3px;
    background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
    box-shadow:
      inset 0 -1px 2px rgba(0, 0, 0, 1),
      inset 0 1px 1px rgba(255, 255, 255, 0.04),
      0 0 0 1px rgba(255, 255, 255, 0.08);
    z-index: 5;
  }

  /* ================= SCREEN ================= */
  .screen {
    position: relative;
    width: 100%;
    height: 55%;
    border-radius: 20px;
    background: #05050a;
    overflow: hidden;
    box-shadow:
      inset 0 0 30px rgba(0, 0, 0, 0.9),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    transition:
      background 2s var(--ease-ios),
      box-shadow 2s var(--ease-ios),
      filter 0.4s var(--ease-ios);
  }
  .screen.on {
    background: linear-gradient(160deg, #e8efff 0%, #c3d5ff 100%);
    box-shadow:
      inset 0 0 25px rgba(122, 162, 255, 0.45),
      0 0 35px rgba(122, 162, 255, 0.4),
      0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .screen.switching {
    filter: brightness(0.3) blur(1px);
  }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.03) 50%);
    background-size: 100% 3px;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 2s var(--ease-ios);
  }
  .screen.on::after { opacity: 0.6; }

  /* Soft specular highlight on glass */
  .screen::before {
    content: '';
    position: absolute;
    top: 0;
    left: 8%;
    right: 8%;
    height: 28%;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.22) 0%,
      rgba(255, 255, 255, 0.06) 40%,
      transparent 100%
    );
    border-radius: 20px 20px 40% 40%;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: opacity 1.5s var(--ease-ios);
  }
  .screen.on::before { opacity: 1; }

  /* ================ SCROLL DOWN ================ */
  #scroll-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 2;
    transition: opacity 1s var(--ease-ios);
    padding: 20px;
    text-align: center;
    pointer-events: none;
  }
  .scroll-title {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e8e8f5;
    text-shadow:
      0 0 12px rgba(220, 225, 255, 0.45),
      0 0 30px rgba(150, 180, 255, 0.3);
    animation: standbyGlow 3.2s ease-in-out infinite;
  }
  @keyframes standbyGlow {
    0%, 100% { opacity: 0.65; }
    50%      { opacity: 1; }
  }
  .scroll-sub {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200, 210, 255, 0.42);
    font-weight: 500;
    animation: standbyGlow 3.2s ease-in-out infinite;
    animation-delay: 0.35s;
  }
  .scroll-arrow {
    margin-top: 8px;
    width: 10px;
    height: 10px;
    border-right: 1.5px solid rgba(200, 210, 255, 0.7);
    border-bottom: 1.5px solid rgba(200, 210, 255, 0.7);
    transform: rotate(45deg);
    animation: arrowBounce 2.2s var(--ease-ios) infinite;
    filter: drop-shadow(0 0 5px rgba(150, 180, 255, 0.6));
  }
  @keyframes arrowBounce {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.45; }
    50%      { transform: rotate(45deg) translate(4px, 4px); opacity: 1; }
  }

  /* ================ BOOT ================ */
  #boot-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 3;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.9s var(--ease-ios), visibility 0.9s var(--ease-ios);
    pointer-events: none;
  }
  .apple-logo {
    width: 38px;
    height: 46px;
    display: block;
    animation: appleFade 1.8s ease-in-out infinite alternate;
  }
  .apple-logo svg { width: 100%; height: 100%; display: block; }
  @keyframes appleFade {
    from { opacity: 0.72; }
    to   { opacity: 1; }
  }
  .boot-bar {
    width: 120px;
    height: 3px;
    background: rgba(10, 10, 26, 0.12);
    border-radius: 3px;
    overflow: hidden;
  }
  .boot-bar span {
    display: block;
    width: 0%;
    height: 100%;
    background: #0a0a1a;
    border-radius: 3px;
    transition: width 0.25s linear;
  }

  /* ================ iOS HOME ================ */
  #home-layer {
    position: absolute;
    inset: 0;
    z-index: 4;
    padding: 12px 10px 18px;
    color: var(--ios-label);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.9s var(--ease-ios), visibility 0.9s var(--ease-ios);
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }

  .home-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: -0.1px;
    padding: 0 6px 6px;
    color: #0a0a1a;
  }
  .home-status .time {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .home-status .icons {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .home-status .icons svg {
    width: 12px;
    height: 9px;
    fill: #0a0a1a;
  }

  .home-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr;
    gap: 12px;
    margin-top: 8px;
    padding: 0 6px;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    pointer-events: none;
  }
  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 3px 8px rgba(0, 0, 0, 0.18),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.25);
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .app-icon svg { width: 26px; height: 26px; fill: currentColor; }
  .app-name {
    font-size: 9px;
    font-weight: 500;
    color: #0a0a1a;
    letter-spacing: -0.1px;
  }

  .app-music .app-icon { background: linear-gradient(180deg, #ff5d8f 0%, #fa3b65 100%); }
  .app-photos .app-icon {
    background: conic-gradient(from 200deg at 50% 50%,
      #ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #5856d6, #af52de, #ff2d55, #ff3b30);
  }
  .app-phone .app-icon { background: linear-gradient(180deg, #34c759 0%, #248a3d 100%); }
  .app-files .app-icon { background: linear-gradient(180deg, #5e5ce6 0%, #3634a3 100%); }
  .app-games .app-icon { background: linear-gradient(180deg, #64d2ff 0%, #0a84ff 100%); }
  .app-clock .app-icon { background: #1c1c1e; }

  /* ================ VOLUME ANIMATION (iOS Style) ================ */
  #volume-anim {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    background: rgba(219, 231, 255, 0);
    transition:
      opacity 0.45s var(--ease-ios),
      visibility 0.45s var(--ease-ios),
      background 0.45s var(--ease-ios);
  }
  #volume-anim.show {
    opacity: 1;
    visibility: visible;
    background: rgba(219, 231, 255, 0.97);
  }

  /* Connection flash ring */
  #volume-anim::before {
    content: '';
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(122, 162, 255, 0);
    transform: scale(0.4);
    opacity: 0;
    pointer-events: none;
  }
  #volume-anim.show::before {
    animation: connectRing 0.7s var(--ease-ios) 0.05s forwards;
  }
  @keyframes connectRing {
    0%   { transform: scale(0.3); opacity: 0.9; border-color: rgba(122, 162, 255, 0.7); }
    100% { transform: scale(1.8); opacity: 0; border-color: rgba(122, 162, 255, 0); }
  }

  .volume-slider {
    width: 42px;
    height: 148px;
    border-radius: 13px;
    background: rgba(120, 120, 128, 0.22);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 6px 20px rgba(10, 10, 26, 0.08),
      0 1px 3px rgba(10, 10, 26, 0.05),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.5);
    transform: scale(0.82) translateY(8px);
    opacity: 0;
    transition:
      transform 0.6s var(--ease-bounce),
      opacity 0.35s var(--ease-ios);
  }
  #volume-anim.show .volume-slider {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .vol-fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 0%;
    background: #ffffff;
    transition: height 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
    box-shadow: 0 -1px 3px rgba(255, 255, 255, 0.5);
  }
  #volume-anim.show .vol-fill {
    height: 68%;
    transition-delay: 0.28s;
  }

  .vol-dots {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3.5px;
    z-index: 3;
  }
  .vol-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(60, 60, 67, 0.75);
    transition: background 0.3s;
  }
  #volume-anim.show .vol-dots span {
    animation: dotPulse 0.5s ease 0.5s both;
  }
  #volume-anim.show .vol-dots span:nth-child(2) { animation-delay: 0.58s; }
  #volume-anim.show .vol-dots span:nth-child(3) { animation-delay: 0.66s; }
  @keyframes dotPulse {
    0%   { transform: scale(1); background: rgba(60, 60, 67, 0.75); }
    40%  { transform: scale(1.35); background: rgba(0, 122, 255, 0.85); }
    100% { transform: scale(1); background: rgba(60, 60, 67, 0.75); }
  }

  .vol-note {
    position: absolute;
    bottom: 13px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    z-index: 3;
  }
  .vol-note svg { width: 100%; height: 100%; display: block; }
  .vol-note svg path { fill: rgba(60, 60, 67, 0.85); transition: fill 0.3s; }
  #volume-anim.show .vol-note svg path {
    animation: noteGlow 0.6s ease 0.7s both;
  }
  @keyframes noteGlow {
    0%, 100% { fill: rgba(60, 60, 67, 0.85); }
    50%      { fill: rgba(0, 122, 255, 0.9); }
  }
  /* ================ PLAYLIST ================ */
  #playlist-layer {
    position: absolute;
    inset: 0;
    z-index: 7;
    display: flex;
    flex-direction: column;
    padding: 14px 14px 16px;
    color: var(--ios-label);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.9s var(--ease-ios), visibility 0.9s var(--ease-ios);
    pointer-events: none;
  }

  .now-playing-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ios-label-secondary);
    padding-bottom: 6px;
    border-bottom: 0.5px solid var(--ios-separator);
    justify-content: space-between;
  }
  .music-header {
    margin-top: 10px;
    margin-bottom: 8px;
  }
  .music-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--ios-label);
  }
  .music-sub {
    font-size: 10px;
    color: var(--ios-label-secondary);
    margin-top: 2px;
    letter-spacing: -0.1px;
  }

  #visualizer {
    width: 100%;
    height: 28px;
    margin-bottom: 10px;
    display: block;
  }

  .tracklist {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    padding-right: 2px;
    margin-bottom: 6px;
  }
  .tracklist::-webkit-scrollbar { display: none; }

  .track {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 8px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.25s var(--ease-ios);
    position: relative;
    pointer-events: auto;
    user-select: none;
    letter-spacing: -0.1px;
  }
  .track:hover { background: rgba(120, 120, 128, 0.08); }
  .track.active {
    background: rgba(120, 120, 128, 0.14);
    font-weight: 600;
  }
  .track .num {
    color: var(--ios-label-tertiary);
    font-variant-numeric: tabular-nums;
    width: 18px;
    font-size: 10px;
    font-weight: 500;
  }
  .track.active .num { opacity: 0; }
  .track .play-icon {
    position: absolute;
    left: 8px;
    width: 11px;
    height: 11px;
    opacity: 0;
    color: var(--ios-label);
    transition: opacity 0.25s var(--ease-ios);
  }
  .track.active .play-icon { opacity: 1; }
  .track .name { flex: 1; }
  .track .dur {
    color: var(--ios-label-tertiary);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .track.active .dur { color: var(--ios-label-secondary); }

  .playing-bar {
    margin-top: 4px;
    height: 2px;
    border-radius: 2px;
    background: rgba(120, 120, 128, 0.16);
    overflow: hidden;
    flex-shrink: 0;
  }
  .playing-bar span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--ios-label);
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  /* ================ CONTROLS (Wheel) ================ */
  .controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .wheel {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #38383f 0%, #202026 40%, #0e0e12 100%);
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.1),
      inset 0 -4px 12px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.06),
      0 8px 20px rgba(0, 0, 0, 0.5);
    position: relative;
    transition: box-shadow 0.35s var(--ease-ios), transform 0.2s var(--ease-ios);
    pointer-events: auto;
    cursor: pointer;
  }
  .wheel:active {
    transform: scale(0.97);
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.5),
      inset 0 -2px 8px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(255, 255, 255, 0.04),
      0 4px 12px rgba(0, 0, 0, 0.45);
  }
  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #1c1c22 0%, #0d0d11 100%);
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, 0.95),
      0 0 0 0.5px rgba(255, 255, 255, 0.05);
    pointer-events: none;
  }

  /* ================ CONTENT SPACER ================ */
  #content {
    position: relative;
    z-index: 4;
    pointer-events: none;
  }
  .spacer { height: 1800vh; }
  .cta-section {
    min-height: 100vh;
    pointer-events: none;
    position: relative;
  }

  /* ================ TELEGRAM BUTTON ================ */
  .tg-btn {
    position: fixed;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%) scale(0.95);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 30px;
    border-radius: 100px;
    background: var(--ios-blue);
    border: none;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    text-decoration: none;
    z-index: 20;
    pointer-events: auto;
    opacity: 0;
    box-shadow:
      0 0 0 rgba(0, 122, 255, 0),
      0 16px 40px rgba(0, 122, 255, 0.3);
    transition:
      opacity 0.9s var(--ease-ios),
      transform 0.9s var(--ease-ios),
      background 0.3s var(--ease-ios),
      box-shadow 0.3s var(--ease-ios);
  }
  .tg-btn.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  .tg-btn:hover {
    background: #fff;
    color: var(--ios-blue);
    box-shadow:
      0 0 60px rgba(0, 122, 255, 0.7),
      0 16px 40px rgba(0, 122, 255, 0.45);
    transform: translateX(-50%) scale(1.04);
  }
  .tg-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .cta-hint {
    position: fixed;
    bottom: calc(8vh - 26px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.3);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.9s var(--ease-ios) 0.15s;
    text-align: center;
    white-space: nowrap;
    font-weight: 500;
  }
  .cta-hint.show { opacity: 1; }

  /* ================ LABEL ================ */
  .label {
    position: fixed;
    top: 30px;
    left: 30px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.35;
    z-index: 5;
    transition: opacity 1.8s var(--ease-ios);
    pointer-events: none;
  }

  /* ================ HEADPHONE JACK ================ */
  #airpods-layer {
    position: fixed;
    top: calc(50% + 500px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5; /* BELOW player (z-index: 20) — tip naturally hides behind body */
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s var(--ease-ios), visibility 0.35s var(--ease-ios);
    will-change: top, transform;
  }

  .headphone-jack {
    width: 20px;
    height: 92px;
    position: relative;
    filter: drop-shadow(0 -2px 5px rgba(0, 0, 0, 0.55));
    margin-bottom: -2px;
    z-index: 2;
    transition: filter 0.3s var(--ease-ios), opacity 0.25s var(--ease-ios);
    transform-origin: center top;
  }
  .headphone-jack.inserted {
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  }
  .headphone-jack svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .headphone-cable {
    width: 120px;
    height: 220px;
    position: relative;
    filter: drop-shadow(1px 1px 3px rgba(0, 0, 0, 0.5));
    margin-top: -2px;
    transform-origin: top center;
  }
  .headphone-cable svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .headphone-cable.plugged {
    animation: cableSway 4.5s ease-in-out infinite;
  }
  @keyframes cableSway {
    0%, 100% { transform: rotate(-0.8deg) translateX(0); }
    50%      { transform: rotate(0.9deg) translateX(1.5px); }
  }

  /* Soft ground shadow under jack while approaching */
  #airpods-layer::before {

  /* ================ MOBILE ================ */

<script>
  const audio = document.getElementById('audio');
  const progressBar = document.getElementById('progress');
  const tracks = document.querySelectorAll('.track');
  const screen = document.getElementById('screen');
  const player = document.getElementById('player');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const body = document.body;

  const scrollLayer = document.getElementById('scroll-layer');
  const bootLayer = document.getElementById('boot-layer');
  const homeLayer = document.getElementById('home-layer');
  const airpodsLayer = document.getElementById('airpods-layer');
  const playlistLayer = document.getElementById('playlist-layer');
  const volumeAnim = document.getElementById('volume-anim');
  const bootProgress = document.getElementById('boot-progress');
  const tgBtn = document.getElementById('tgBtn');
  const ctaHint = document.getElementById('ctaHint');
  const roomLight = document.getElementById('room-light');
  const label = document.querySelector('.label');
  const wheel = document.getElementById('wheel');
  const jackPort = document.querySelector('.jack-port');
  const headphoneJack = document.querySelector('.headphone-jack');
  const headphoneCable = document.querySelector('.headphone-cable');

  let musicStarted = false;
  let currentTrackIndex = 0;
  let switchingTimeout = null;

  let currentProgress = 0;
  let targetProgress = 0;
  let mouseX = 0, mouseY = 0;
  let smoothMouseX = 0, smoothMouseY = 0;

  function clearSwitching() {
    screen.classList.remove('switching');
    if (switchingTimeout) {
      clearTimeout(switchingTimeout);
      switchingTimeout = null;
    }
  }

  function playTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    currentTrackIndex = index;
    tracks.forEach(t => t.classList.remove('active'));
    tracks[index].classList.add('active');

    const src = tracks[index].dataset.src;
    screen.classList.add('switching');
    clearTimeout(switchingTimeout);
    switchingTimeout = setTimeout(clearSwitching, 3000);

    audio.src = src;
    audio.volume = 0.6;

    const p = audio.play();
    if (p && p.then) {
      p.then(() => {
        musicStarted = true;
        setTimeout(clearSwitching, 250);
      }).catch(() => {
        musicStarted = false;
        clearSwitching();
      });
    }
  }

  audio.addEventListener('playing', () => { musicStarted = true; clearSwitching(); });
  audio.addEventListener('error', () => { musicStarted = false; clearSwitching(); });

  tracks.forEach((track, i) => {
    track.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (i === currentTrackIndex && !audio.paused) return;
      playTrack(i);
    });
  });

  audio.addEventListener('ended', () => {
    playTrack((currentTrackIndex + 1) % tracks.length);
  });

  wheel.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!audio.src) { playTrack(0); return; }
    if (audio.paused) {
      audio.play().then(() => musicStarted = true).catch(() => {});
    } else {
      audio.pause();
    }
  });

  let wheelTouchStartY = null;
  wheel.addEventListener('touchstart', (e) => {
    wheelTouchStartY = e.touches[0].clientY;
  }, { passive: true });
  wheel.addEventListener('touchend', (e) => {
    if (wheelTouchStartY === null) return;
    const dy = e.changedTouches[0].clientY - wheelTouchStartY;
    if (Math.abs(dy) > 30) {
      const next = dy < 0
        ? (currentTrackIndex + 1) % tracks.length
        : (currentTrackIndex - 1 + tracks.length) % tracks.length;
      playTrack(next);
    }
    wheelTouchStartY = null;
  });

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) return;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resizeCanvas);

  let _barPhase = 0;
  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    if (w === 0) return;
    ctx.clearRect(0, 0, w, h);
    const barCount = 32;
    const barWidth = w / barCount;
    const gap = 1.5;
    const playing = musicStarted && !audio.paused;
    const intensity = playing ? 0.55 : 0.08;
    _barPhase += playing ? 0.09 : 0.015;
    for (let i = 0; i < barCount; i++) {
      const wave = Math.sin(_barPhase + i * 0.48) + Math.sin(_barPhase * 1.65 + i * 0.85) + Math.sin(_barPhase * 0.55 + i * 1.25);
      const combined = wave / 3;
      const centerBoost = 1 - Math.abs(i - barCount / 2) / (barCount / 2) * 0.25;
      const value = 0.12 + Math.abs(combined) * intensity * centerBoost + 0.04;
      const barHeight = Math.max(2, value * h);
      const x = i * barWidth;
      const y = h - barHeight;
      const grad = ctx.createLinearGradient(0, y, 0, h);
      grad.addColorStop(0, playing ? '#8bb4ff' : '#7aa2ff');
      grad.addColorStop(0.55, playing ? '#4a6fd0' : '#3a5fb8');
      grad.addColorStop(1, '#0a0a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(x + gap / 2, y, barWidth - gap, barHeight);
    }
  }
  drawVisualizer();
  setTimeout(resizeCanvas, 200);
  setTimeout(resizeCanvas, 800);

  const clockEl = document.getElementById('clock');
  function updateClock() {
    const d = new Date();
    clockEl.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  setInterval(() => {
    if (!audio.duration || isNaN(audio.duration)) return;
    progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
  }, 250);

  function updateTargetProgress() {
    const docHeight = document.body.scrollHeight - window.innerHeight;
    targetProgress = docHeight > 0 ? Math.min(1, Math.max(0, window.scrollY / docHeight)) : 0;
  }
  window.addEventListener('scroll', updateTargetProgress, { passive: true });
  window.addEventListener('resize', updateTargetProgress);
  updateTargetProgress();

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 6;
    mouseY = (e.clientY / window.innerHeight - 0.5) * -6;
  });

  let screenOn = false;
  let bootVisible = false;
  let homeVisible = false;
  let airpodsVisible = false;
  let playlistVisible = false;
  let btnVisible = false;
  let volumeAnimShown = false;
  let jackPlugged = false;

  function tick() {
    requestAnimationFrame(tick);

    currentProgress += (targetProgress - currentProgress) * 0.05;
    smoothMouseX += (mouseX - smoothMouseX) * 0.06;
    smoothMouseY += (mouseY - smoothMouseY) * 0.06;

    const p = currentProgress;

    // PHASE 1: LIFT PLAYER
    const liftProgress = Math.min(1, p / 0.12);
    const easeLift = 1 - Math.pow(1 - liftProgress, 3);
    const scale = 0.85 + 0.15 * easeLift;
    const rotX = 15 + (0 - 15) * easeLift;
    const transY = 40 + (0 - 40) * easeLift;
    const mouseInfluence = Math.max(0, (p - 0.10) / 0.20);
    const finalRotX = rotX + smoothMouseY * 0.3 * mouseInfluence;
    const finalRotY = smoothMouseX * 0.3 * mouseInfluence;
    player.style.transform = `scale(${scale}) rotateX(${finalRotX}deg) rotateY(${finalRotY}deg) translateY(${transY}px)`;

    const glowAmount = Math.max(0, (p - 0.15) / 0.35);
    player.style.boxShadow = `
      inset 0 1px 1px rgba(255,255,255,${0.12 + 0.04 * glowAmount}),
      inset 0 -2px 4px rgba(0,0,0,0.7),
      0 50px 100px rgba(0,0,0,${0.75 + 0.05 * glowAmount}),
      0 20px 40px rgba(0,0,0,${0.5 + 0.1 * glowAmount}),
      0 0 0 1px rgba(255,255,255,${0.06 + 0.04 * glowAmount})
    `;

    // PHASE 2: SCREEN ON
    const screenOnProgress = Math.max(0, Math.min(1, (p - 0.10) / 0.08));
    if (screenOnProgress > 0.5 && !screenOn) { screen.classList.add('on'); screenOn = true; }
    else if (screenOnProgress <= 0.5 && screenOn) { screen.classList.remove('on'); screenOn = false; }

    scrollLayer.style.opacity = Math.max(0, 1 - p / 0.10);

    // PHASE 3: BOOT
    const bootOpacity = Math.max(0, Math.min(1, (p - 0.18) / 0.06)) *
                        Math.max(0, Math.min(1, (0.34 - p) / 0.06));
    if (bootOpacity > 0.01) {
      bootLayer.style.opacity = bootOpacity;
      bootLayer.style.visibility = 'visible';
      bootVisible = true;
      const bootPct = Math.min(100, Math.max(0, ((p - 0.18) / 0.16) * 100));
      bootProgress.style.width = bootPct + '%';
    } else {
      if (bootVisible) {
        bootLayer.style.opacity = 0;
        bootLayer.style.visibility = 'hidden';
        bootVisible = false;
      }
    }

    // PHASE 4: iOS HOME
    const homeOpacity = Math.max(0, Math.min(1, (p - 0.34) / 0.06)) *
                        Math.max(0, Math.min(1, (0.58 - p) / 0.06));
    if (homeOpacity > 0.01) {
      homeLayer.style.opacity = homeOpacity;
      homeLayer.style.visibility = 'visible';
      homeVisible = true;
    } else {
      if (homeVisible) {
        homeLayer.style.opacity = 0;
        homeLayer.style.visibility = 'hidden';
        homeVisible = false;
      }
    }
    // PHASE 5: JACK + VOLUME + PLAYLIST
    // Plug window: scroll 0.58 → 0.80
    const plugProgress = Math.max(0, Math.min(1, (p - 0.58) / 0.22));

    if (plugProgress > 0.01) {
      airpodsLayer.style.opacity = 1;
      airpodsLayer.style.visibility = 'visible';
      airpodsVisible = true;

      // No clip-path — metal hides naturally behind player (z-index 5 < 20)
      headphoneJack.style.clipPath = '';

      // Ease: slow approach → soft seat
      const easePlug = plugProgress < 0.5
        ? 4 * plugProgress * plugProgress * plugProgress
        : 1 - Math.pow(-2 * plugProgress + 2, 3) / 2;

      // Anchor to real jack-port position on screen
      const portRect = jackPort.getBoundingClientRect();
      const jackH = headphoneJack.offsetHeight || 92;
      // SVG: metal ends ~46% down; white body is the rest.
      // Seat so metal/white junction sits just BELOW port bottom —
      // white block never enters the socket.
      const metalRatio = 0.46;
      const endY = portRect.bottom - jackH * metalRatio;
      // Start: well below the port
      const startY = portRect.top + 280;

      const currentY = startY + (endY - startY) * easePlug;
      airpodsLayer.style.top = currentY + 'px';
      airpodsLayer.style.left = (portRect.left + portRect.width / 2) + 'px';
      airpodsLayer.style.transform = 'translateX(-50%)';

      // Approaching shadow
      if (plugProgress > 0.1 && plugProgress < 0.95) {
        airpodsLayer.classList.add('approaching');
      } else {
        airpodsLayer.classList.remove('approaching');
      }

      // Connected when fully seated (white block under port)
      if (plugProgress >= 0.90) {
        if (!jackPlugged) {
          jackPlugged = true;
          headphoneJack.classList.add('inserted');
          headphoneCable.classList.add('plugged');
        }
      } else if (jackPlugged && plugProgress < 0.78) {
        jackPlugged = false;
        headphoneJack.classList.remove('inserted');
        headphoneCable.classList.remove('plugged');
      }

      // VOLUME ANIMATION — exact seat moment
      if (plugProgress >= 0.91 && !volumeAnimShown) {
        volumeAnimShown = true;
        volumeAnim.classList.add('show');
        setTimeout(() => {
          volumeAnim.classList.remove('show');
        }, 2400);
      }
    } else {
      if (airpodsVisible && p < 0.52) {
        airpodsLayer.style.opacity = 0;
        airpodsLayer.style.visibility = 'hidden';
        airpodsVisible = false;
        volumeAnimShown = false;
        volumeAnim.classList.remove('show');
        jackPlugged = false;
        headphoneJack.classList.remove('inserted');
        headphoneJack.style.clipPath = '';
        headphoneCable.classList.remove('plugged');
        airpodsLayer.classList.remove('approaching');
      }
    }

    // PHASE 6: PLAYLIST (appears after volume anim / connection)
    const playlistOpacity = Math.max(0, Math.min(1, (p - 0.78) / 0.06)) *
                            Math.max(0, Math.min(1, (1.05 - p) / 0.08));
    if (playlistOpacity > 0.01) {
      playlistLayer.style.opacity = playlistOpacity;
      playlistLayer.style.visibility = 'visible';
      playlistLayer.style.pointerEvents = 'auto';
      playlistVisible = true;
    } else {
      if (playlistVisible) {
        playlistLayer.style.opacity = 0;
        playlistLayer.style.visibility = 'hidden';
        playlistLayer.style.pointerEvents = 'none';
        playlistVisible = false;
      }
    }

    // Auto-start first track once playlist is fully visible and jack plugged
    if (playlistOpacity > 0.85 && jackPlugged && !musicStarted && !audio.src) {
      playTrack(0);
    }

    // ATMOSPHERE + music glow
    const atmosphere = Math.max(0, Math.min(1, (p - 0.20) / 0.30));
    const musicGlow = musicStarted && !audio.paused ? 0.15 : 0;
    roomLight.style.opacity = Math.min(1, atmosphere + musicGlow);
    body.style.background = atmosphere > 0.3 ? '#0a0a14' : '#000000';

    // Extra player glow when music is playing
    if (musicStarted && !audio.paused && p > 0.7) {
      player.style.boxShadow = `
        inset 0 1px 1px rgba(255,255,255,0.16),
        inset 0 -2px 4px rgba(0,0,0,0.7),
        0 50px 100px rgba(0,0,0,0.8),
        0 20px 40px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.1),
        0 0 40px rgba(122,162,255,0.18)
      `;
    }

    // PHASE 7: TELEGRAM BUTTON
    const btnProgress = Math.max(0, Math.min(1, (p - 0.92) / 0.04));
    if (btnProgress > 0.01 && !btnVisible) {
      tgBtn.classList.add('show');
      ctaHint.classList.add('show');
      btnVisible = true;
    } else if (btnProgress <= 0.01 && btnVisible) {
      tgBtn.classList.remove('show');
      ctaHint.classList.remove('show');
      btnVisible = false;
    }

    const riseProgress = Math.max(0, Math.min(1, (p - 0.95) / 0.05));
    const easeRise = riseProgress < 0.5
      ? 4 * riseProgress * riseProgress * riseProgress
      : 1 - Math.pow(-2 * riseProgress + 2, 3) / 2;

    const bottomVh = 8 + (50 - 8) * easeRise;
    tgBtn.style.bottom = bottomVh + 'vh';
    ctaHint.style.bottom = (bottomVh - 3) + 'vh';

    label.style.opacity = 0.35 + atmosphere * 0.25;
  }
  tick();

  window.addEventListener('load', () => {
    setTimeout(resizeCanvas, 300);
  });
</script>
</body>
